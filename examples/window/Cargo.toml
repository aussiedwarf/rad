[package]
name = "window"
version = "0.1.0"
authors = ["Eden Harris <aussiedwarf@gmail.com>"]
edition = "2024"
rust-version = "1.91"

[dependencies]
rad = { path = "../../rad" }

clap = {version = "4.5.51", features = ["derive"]}
glam = "0.30.9"
image = {version = "0.25.8", default-features = false, features = ["png", "jpeg", "bmp"]}
libc = "0.2.177"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { git = "https://github.com/Rust-SDL2/rust-sdl2.git", rev = "400e033", default-features = false, features = ["static-link", "bundled", "raw-window-handle"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sdl2 = { git = "https://github.com/Rust-SDL2/rust-sdl2.git", rev = "400e033", default-features = false, features = ["static-link", "bundled"] }

[target.'cfg(target_os = "emscripten")'.features]
default = ["pthread"]

