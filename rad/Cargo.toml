[package]
name = "rad"
version = "0.1.0"
authors = ["Eden Harris <aussiedwarf@gmail.com>"]
edition = "2024"
rust-version = "1.91"

[lib]
name = "rad"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

#"bundled", "static-link", "ttf",
[dependencies]
ash = "0.38.0+1.3.281"
murmur3 = "0.5.2"
static_assertions = "1.1.0"
gl = "0.14.0"
glam = "0.30.9"
libc = "0.2.177"
bitflags = "2.10.0"
image = {version = "0.25.8", default-features = false, features = ["png", "jpeg", "bmp"]}
raw-window-handle = "0.6.2"
strum = "0.27.2"
strum_macros = "0.27.2"

sdl3 = { version = "0.16.1", default-features = false, features = ["ash", "static-link", "build-from-source", "raw-window-handle"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging",
]



[target.'cfg(target_vendor = "apple")'.dependencies]
metal = "0.30.0"
cocoa = "0.26.0"
objc = "0.2.7"

[target.'cfg(target_os = "emscripten")'.features]
default = ["pthread"]

[[test]]
name = "window_tests"
harness = false

